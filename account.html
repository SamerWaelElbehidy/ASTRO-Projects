<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account — ASTRO Projects</title>
  <meta name="description" content="Your ASTRO projects, team invitations and discount code — the same account as the ASTRO Store.">
  <meta name="theme-color" content="#07080d">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css?v=17">
  <link rel="stylesheet" href="css/modal.css?v=17">
  <link rel="stylesheet" href="css/site.css?v=17">
  <link rel="stylesheet" href="css/order.css?v=17">
  <link rel="stylesheet" href="css/account.css?v=17">
</head>
<body class="booking">
  <header class="nav scrolled" id="nav">
    <div class="wrap nav-in">
      <a href="index.html" class="logo" aria-label="ASTRO Projects"><img src="assets/astro-logo-white.webp" alt="ASTRO — Smart Technology Solutions" width="76" height="46"></a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">Home</a></li>
        <li><a href="index.html#work" data-i18n="nav.projects">Projects</a></li>
        <li><a href="order.html" data-i18n="nav.book">Book a project</a></li>
        <li><a href="world.html" data-i18n="nav.world">3D world</a></li>
      </ul>
      <div class="nav-actions">
        <button class="btn lang" id="lang-toggle" type="button">عربي</button>
      </div>
    </div>
  </header>

  <main class="order-page">
    <div class="wrap narrow">
      <div class="order-head">
        <h1 class="title" data-i18n="acc.title">My account</h1>
      </div>

      <div id="gate-wrap" hidden></div>

      <div id="acc-wrap" hidden>
        <div class="acc-head">
          <div id="acc-who"></div>
          <button class="btn" id="b-signout" type="button" data-i18n="acc.signOut">Sign out</button>
        </div>

        <div class="tabs2" role="tablist">
          <button class="tab2 on" id="tab-projects" role="tab" type="button" data-i18n="acc.tab.projects">My projects</button>
          <button class="tab2" id="tab-invites" role="tab" type="button">
            <span data-i18n="acc.tab.invites">Invitations</span><span class="badge" id="invite-badge" hidden></span>
          </button>
          <button class="tab2" id="tab-code" role="tab" type="button" data-i18n="acc.tab.code">Discount code</button>
        </div>

        <section id="view-projects"><div class="card-form"><div class="form-body" id="projects-body"></div></div></section>
        <section id="view-invites" hidden><div class="card-form"><div class="form-body" id="invites-body"></div></div></section>
        <section id="view-code" hidden><div class="card-form"><div class="form-body" id="code-body"></div></div></section>
      </div>
    </div>
  </main>

  <footer><div class="wrap"><span class="f-brand"><img src="assets/astro-symbol.webp" alt="" width="14" height="28"> © <span id="yr"></span> ASTRO Projects</span><span>New Damietta, Egypt</span></div></footer>

  <script src="js/icons.js?v=17"></script>
  <script src="js/data.js?v=17"></script>
  <script src="js/config.js?v=17"></script>
  <script src="js/i18n-order.js?v=17"></script>
  <script src="js/store-auth.js?v=17"></script>
  <script src="js/account.js?v=17"></script>
</body>
</html>
